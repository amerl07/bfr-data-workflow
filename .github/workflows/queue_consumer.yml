name: Run queue consumer

# Scheduled replacement for manually running
# `.venv/bin/python -m ingestion.queue_consumer.main`. Mirrors the
# drive-watcher's own move from push notifications to a polling trigger
# (see ingestion/drive-watcher/README.md) -- same tradeoff, just one layer
# further down the pipeline: a dumb timer beats a push mechanism that has
# to actually fire.
#
# The `schedule:` trigger below is a low-priority fallback only -- GitHub
# treats it as best-effort and observed gaps of 1.5-3 hours against this
# same 5-minute cron (found 2026-07-29), not a bug in this config. The
# real trigger is an external cron service (e.g. cron-job.org) calling the
# `workflow_dispatch` REST API on an actual schedule -- see README.md's
# "Automated ingestion" section for setup. Both triggers share the
# concurrency group below, so overlap between them is harmless.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Prevents two runs from racing on the same queue rows or both appending
  # to data/results.csv and fighting over the push.
  group: queue-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write OAuth token
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: echo "$GOOGLE_OAUTH_TOKEN_JSON" > ingestion/queue_consumer/token.json

      - name: Run queue consumer
        run: python -m ingestion.queue_consumer.main

      - name: Commit data/results.csv if it changed
        # Confirmed 2026-09-17: the concurrency group above stops two runs
        # from EXECUTING at once, but not from racing on the push -- e.g. a
        # manual commit (or another trigger's run) landing on origin/main
        # between this job's checkout and its own `git push` still makes
        # the plain `git push` below fail (non-fast-forward), and that
        # happened for a real batch: ingestion/queue_consumer/main.py had
        # already marked every row in that batch "done" in the Processing
        # Queue sheet (status is set right after a successful *local*
        # append, well before this step runs), so the lost row was never
        # retried -- queue_consumer only ever re-reads rows still marked
        # "pending". Rebase onto the latest origin/main and retry a few
        # times before giving up, so a losing race self-heals here instead
        # of silently stranding a "done" row with no data in results.csv.
        run: |
          if git diff --quiet -- data/results.csv; then
            echo "No changes to data/results.csv"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/results.csv
            git commit -m "Auto-update data/results.csv from queue consumer"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed -- rebasing onto latest origin/main and retrying"
              git fetch origin main
              git rebase origin/main
            done
            echo "Failed to push data/results.csv after 5 attempts" >&2
            exit 1
          fi
